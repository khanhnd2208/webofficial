name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Path filters call the GitHub API for changed files on pull requests.
# actions: read finds the last green main run to diff against.
permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/teaching_platform_vocab_test
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/teaching_platform_vocab_test
  AUTH_SECRET: ci-test-secret-not-for-production
  AUTH_URL: https://ci.invalid
  NEXTAUTH_URL: https://ci.invalid
  # Placeholders so `next start` can boot in CI. Not real Google credentials.
  GOOGLE_CLIENT_ID: ci-not-a-real-google-client-id
  GOOGLE_CLIENT_SECRET: ci-not-a-real-google-client-secret
  MONGODB_URI: mongodb://127.0.0.1:27017/ci_placeholder
  # Release builds mirror production: unfinished learner surfaces fail closed.
  PUBLIC_TESTS_ENABLED: 'false'
  PUBLIC_KNOWLEDGE_ENABLED: 'false'
  TEACHING_GROUP_BOARD_ENABLED: 'false'

jobs:
  # A push to main whose files match a CI run that already fully passed (the
  # merged pull request's test merge) skips the checks below: they would test
  # identical source, and the deploy ships that run's build. Only when the
  # previous main commit is green: after a failed or cancelled main run, the
  # full run widens end-to-end selection to cover it (see e2e below). Pull
  # requests, and any lookup error, always run everything.
  reuse:
    name: Find an identical tested tree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hit: ${{ steps.find.outputs.hit }}
    steps:
      - name: Look for a successful CI run of this source tree
        id: find
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Only a confirmed match writes hit=true; every other exit runs the checks.
          set -uo pipefail
          commit="$(gh api "repos/$GH_REPO/commits/$GITHUB_SHA" \
            --jq '[.commit.tree.sha, (.parents[0].sha // "")] | @tsv')" || exit 0
          IFS=$'\t' read -r tree parent <<<"$commit"
          green_parent="$(
            gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$parent&branch=main&event=push&status=success&per_page=1" \
              --jq '.total_count'
          )" || exit 0
          if [[ -z "$parent" || "$green_parent" == "0" ]]; then
            echo "The previous main commit has no successful CI run; running every check."
            exit 0
          fi
          candidates="$(
            gh api "repos/$GH_REPO/actions/artifacts?name=next-build-$tree&per_page=20" \
              --jq '.artifacts[] | select(.expired | not) | .workflow_run.id'
          )" || exit 0
          for run_id in $candidates; do
            [[ "$run_id" == "$GITHUB_RUN_ID" ]] && continue
            run="$(gh api "repos/$GH_REPO/actions/runs/$run_id" \
              --jq '[.path, .conclusion, .head_repository.full_name] | @tsv')" || continue
            IFS=$'\t' read -r path conclusion head_repo <<<"$run"
            if [[ "$path" == ".github/workflows/ci.yml" && "$conclusion" == "success" && "$head_repo" == "$GH_REPO" ]]; then
              echo "CI run $run_id already passed every check for tree $tree; skipping the repeat."
              echo "hit=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No successful CI run for tree $tree; running every check."

  static:
    name: Typecheck, lint, audit
    needs: reuse
    if: needs.reuse.outputs.hit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npx prisma validate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Format check
        run: npm run format:check

      - name: Area map check
        run: npm run areas:check

      - name: Dependency audit
        run: npm audit --audit-level=moderate

  unit-integration:
    name: Unit and integration tests
    needs: reuse
    if: needs.reuse.outputs.hit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teaching_platform_vocab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma migrate (test DB)
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

  component:
    name: Component tests
    needs: reuse
    if: needs.reuse.outputs.hit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Component tests
        run: npm run test:component

  build:
    name: Production build
    needs: reuse
    if: needs.reuse.outputs.hit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.release.outputs.artifact }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teaching_platform_vocab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma migrate (test DB)
        run: npx prisma migrate deploy

      - name: Cache Next.js compiler output
        uses: actions/cache@v4
        with:
          path: .next/cache
          # Reusing a different source tree's cache can retain old compiled CSS after
          # Teaching styles move into imports. Restore only an identical build input.
          key: next-cache-v2-${{ runner.os }}-${{ hashFiles('package-lock.json', 'postcss.config.mjs', 'package.json', 'prisma.config.ts', '.github/workflows/ci.yml') }}-${{ hashFiles('src/**', 'content/**', 'prisma/**', 'next.config.ts', 'tsconfig.json') }}

      # The deploy ships this exact build to the VPS instead of rebuilding there.
      # It finds the artifact by source tree, so any commit with identical
      # files (a PR's test merge and the merge commit on main) shares it.
      - name: Name the release build
        id: release
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "artifact=next-build-$tree" >> "$GITHUB_OUTPUT"
          echo "deployment_id=ci-${tree:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      # Next.js inlines NEXT_PUBLIC_* values and the public learning locks into
      # the build. They come from repository variables that mirror the VPS
      # .env.local; the deploy compares .next/BUILD_ENV with that file and
      # rebuilds on the VPS when anything differs. Unset variables stay unset.
      - name: Build
        env:
          NEXT_DEPLOYMENT_ID: ${{ steps.release.outputs.deployment_id }}
          RELEASE_NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          RELEASE_NEXT_PUBLIC_URL: ${{ vars.NEXT_PUBLIC_URL }}
          RELEASE_NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${{ vars.NEXT_PUBLIC_UMAMI_SCRIPT_URL }}
          RELEASE_NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
        run: |
          set -euo pipefail
          build_env="${RUNNER_TEMP}/build-env"
          : > "$build_env"
          for key in NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_URL NEXT_PUBLIC_UMAMI_SCRIPT_URL NEXT_PUBLIC_UMAMI_WEBSITE_ID; do
            source_key="RELEASE_${key}"
            value="${!source_key:-}"
            if [[ -n "$value" ]]; then
              export "$key=$value"
              printf '%s=%s\n' "$key" "$value" >> "$build_env"
            fi
          done
          printf 'PUBLIC_TESTS_ENABLED=%s\nPUBLIC_KNOWLEDGE_ENABLED=%s\n' \
            "$PUBLIC_TESTS_ENABLED" "$PUBLIC_KNOWLEDGE_ENABLED" >> "$build_env"
          npm run build
          cp "$build_env" .next/BUILD_ENV
          printf '%s\n' "$NEXT_DEPLOYMENT_ID" > .next/DEPLOYMENT_ID
          printf '%s\n' "${{ steps.release.outputs.tree }}" > .next/SOURCE_TREE

      # Pack with tar: .next/node_modules holds relative symlinks
      # (../../node_modules/<pkg>) to server externals such as mongoose and pg.
      # upload-artifact drops symlinks, and the server then fails to load them.
      - name: Pack the production build
        run: |
          set -euo pipefail
          tar --exclude=.next/cache -cf "${RUNNER_TEMP}/next-build.tar" .next
          tar -tf "${RUNNER_TEMP}/next-build.tar" .next/BUILD_ID > /dev/null

      # Three days covers a pull request merged the day after its last CI run.
      - name: Upload the production build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifact }}
          path: ${{ runner.temp }}/next-build.tar
          retention-days: 3
          if-no-files-found: error

  e2e:
    name: End-to-end tests
    needs: build
    runs-on: ubuntu-latest
    env:
      NEXT_BUILD_ARTIFACT: ${{ needs.build.outputs.artifact }}
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: teaching_platform_vocab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          # History is needed to diff against the last green main commit.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the production build
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.NEXT_BUILD_ARTIFACT }}
          path: ${{ runner.temp }}/next-build

      - name: Unpack the production build
        run: |
          set -euo pipefail
          tar -xf "${RUNNER_TEMP}/next-build/next-build.tar"
          test -s .next/BUILD_ID
          broken="$(find .next -type l ! -exec test -e {} ';' -print)"
          if [[ -n "$broken" ]]; then
            echo "Broken symlinks in the unpacked build:" >&2
            echo "$broken" >&2
            exit 1
          fi
          # `next start` must run with the build's deployment ID, as on the VPS;
          # a mismatch turns every client navigation into a full reload.
          echo "NEXT_DEPLOYMENT_ID=$(cat .next/DEPLOYMENT_ID)" >> "$GITHUB_ENV"

      - name: Prisma migrate (test DB)
        run: npx prisma migrate deploy

      - name: Seed release-critical E2E data
        run: |
          npm run db:seed:teaching
          npm run db:sync:active-recall

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      # On main, diff against the last commit whose CI passed, not only the
      # previous push. A cancelled or failed run would otherwise let its changes
      # reach production without their area's end-to-end specs.
      - name: Pick the comparison base
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "full=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$(
            gh run list \
              --workflow ci.yml \
              --branch main \
              --event push \
              --status success \
              --limit 1 \
              --json headSha \
              --jq '.[0].headSha // ""'
          )"
          if [[ -n "$base" ]] && git merge-base --is-ancestor "$base" HEAD; then
            echo "Comparing against the last green main commit $base"
            echo "sha=$base" >> "$GITHUB_OUTPUT"
            echo "full=false" >> "$GITHUB_OUTPUT"
          else
            echo "No green ancestor on main; running every end-to-end spec"
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Select end-to-end areas
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.base.outputs.sha }}
          filters: .github/e2e-path-filters.yml

      # `every` is required. The outside list starts with "**"; the default
      # quantifier "some" would match that pattern alone and ignore every negation.
      - name: Select unclassified changes
        id: outside
        uses: dorny/paths-filter@v3
        with:
          base: ${{ steps.base.outputs.sha }}
          predicate-quantifier: every
          filters: .github/e2e-outside-filter.yml

      - name: Release-critical end-to-end tests
        env:
          AREA_CLASSROOM: ${{ steps.filter.outputs.classroom }}
          AREA_PORTFOLIO: ${{ steps.filter.outputs.portfolio }}
          AREA_SHARED: ${{ steps.filter.outputs.shared }}
          AREA_OUTSIDE: ${{ steps.outside.outputs.outside }}
          RUN_ALL_E2E: ${{ steps.base.outputs.full }}
        run: |
          set -euo pipefail
          is_true() { [[ "${1:-}" == "true" ]]; }
          run_all=0
          if is_true "$RUN_ALL_E2E" || is_true "$AREA_SHARED" || is_true "$AREA_OUTSIDE"; then
            run_all=1
          fi
          # e2e/my-class.admin.spec.ts remains excluded because its vocabulary CSV
          # headless clipboard case already fails on main (2026-09-30).
          specs=(
            e2e/smoke.spec.ts
            e2e/public-feature-locks.spec.ts
            e2e/mobile-smoke.spec.ts
            e2e/login-return.spec.ts
            e2e/legacy-links.spec.ts
          )
          if [[ "$run_all" -eq 1 ]] || is_true "$AREA_PORTFOLIO"; then
            specs+=(
              e2e/editorial-premium.spec.ts
              e2e/personal-book.spec.ts
              e2e/operating-focus.spec.ts
              e2e/learn-reader.spec.ts
              e2e/learn-studio.spec.ts
            )
          fi
          if [[ "$run_all" -eq 1 ]] || is_true "$AREA_CLASSROOM"; then
            specs+=(
              e2e/active-recall-admin.spec.ts
              e2e/active-recall.spec.ts
              e2e/admin-workspace.spec.ts
              e2e/teaching-admin-workspace.spec.ts
              e2e/teaching-surface.spec.ts
              e2e/teaching-attendance-board.spec.ts
              e2e/teaching-learning-experience-mobile.spec.ts
              e2e/teaching-learning-experience-multi-device.spec.ts
              e2e/my-class.spec.ts
              e2e/myspace-tests.spec.ts
            )
          fi
          echo "E2E selection full=${RUN_ALL_E2E} classroom=${AREA_CLASSROOM} portfolio=${AREA_PORTFOLIO} shared=${AREA_SHARED} outside=${AREA_OUTSIDE}"
          printf ' - %s\n' "${specs[@]}"
          npx playwright test "${specs[@]}"

      - name: Teaching groups end-to-end tests
        if: >-
          steps.base.outputs.full == 'true' ||
          steps.filter.outputs.classroom == 'true' ||
          steps.filter.outputs.shared == 'true' ||
          steps.outside.outputs.outside == 'true'
        env:
          TEACHING_GROUP_BOARD_ENABLED: 'true'
        run: npx playwright test e2e/teaching-groups.spec.ts
