# Unclassified-change filter for CI end-to-end selection.
# This file is applied by a separate dorny/paths-filter step with
# predicate-quantifier: every. A changed file counts as unclassified only when
# it matches every pattern here: "**" plus a negation for each claimed path.
# With the default quantifier "some", "**" would match every file and the
# negations would never exclude anything.
#
# Keep this list, .github/e2e-path-filters.yml, the ESLint globs in
# eslint.config.mjs, and docs/areas.md aligned.

