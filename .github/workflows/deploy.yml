name: 🚀 Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Build check trên GitHub runner
  # ─────────────────────────────────────────────
  build-check:
    name: 🔍 Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_URL: ${{ secrets.AUTH_URL }}
          AUTH_TRUST_HOST: "true"
          NODE_ENV: production

  # ─────────────────────────────────────────────
  # JOB 2: Deploy lên VPS qua SSH
  # ─────────────────────────────────────────────
  deploy:
    name: 🚢 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-check
    environment:
      name: production
      url: https://toiladuykhanh.com

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          command_timeout: 10m
          script: |
            set -e

            echo "📂 [1/4] Pull latest code..."
            cd /var/www/webofficial
            git fetch origin main
            git reset --hard origin/main

            echo "📦 [2/4] Install dependencies..."
            npm ci --production=false

            echo "🏗️  [3/4] Build Next.js..."
            npm run build

            echo "♻️  [4/4] Reload app (zero-downtime)..."
            pm2 reload nextjs-app --update-env

            echo "✅ Deploy hoàn tất!"
            pm2 status nextjs-app --no-color
