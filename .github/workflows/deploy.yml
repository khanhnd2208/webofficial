name: 🚀 Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚢 Build & Deploy on VPS
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://toiladuykhanh.com

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2222
          command_timeout: 15m
          script: |
            set -e

            echo "📂 [1/5] Pull latest code from GitHub..."
            cd /var/www/webofficial
            git fetch origin main
            git reset --hard origin/main

            echo "📦 [2/5] Install dependencies..."
            npm install --include=dev

            echo "🔧 [3/5] Prisma generate + migrate..."
            npx prisma generate
            npx prisma migrate deploy

            echo "🏗️  [4/5] Build Next.js..."
            npm run build

            echo "♻️  [5/5] Reload app (zero-downtime)..."
            pm2 reload nextjs-app --update-env

            echo "✅ Deploy hoàn tất!"
            pm2 status nextjs-app --no-color
