name: 🚀 Deploy to VPS

on:
  # Every push to main deploys once its CI run succeeds; manual runs stay available.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    name: 🚢 Release-based VPS deploy
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    env:
      # workflow_run runs against main's tip, so deploy the commit CI actually tested.
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    environment:
      name: production
      url: https://toiladuykhanh.com

    steps:
      - name: Check out the requested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1

      - name: Require main with a successful CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Production deploys must run from refs/heads/main, not $GITHUB_REF" >&2
            exit 1
          fi

          conclusion="$(
            gh run list \
              --workflow ci.yml \
              --commit "$DEPLOY_SHA" \
              --limit 1 \
              --json conclusion \
              --jq '.[0].conclusion // ""'
          )"
          if [[ "$conclusion" != "success" ]]; then
            echo "CI has not succeeded for $DEPLOY_SHA (conclusion: ${conclusion:-missing})" >&2
            exit 1
          fi

      # CI uploads its tested `.next` build as next-build-<source tree>. A pull
      # request run counts when its test merge has exactly the files of this
      # commit. Only runs from this repository that fully succeeded qualify; with
      # none, the deploy builds on the VPS as before.
      - name: Fetch the build CI tested for this source tree
        id: prebuilt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse "${DEPLOY_SHA}^{tree}")"
          name="next-build-$tree"
          candidates="$(
            gh api "repos/$GH_REPO/actions/artifacts?name=$name&per_page=20" \
              --jq '.artifacts[] | select(.expired | not) | .workflow_run.id' || true
          )"
          for run_id in $candidates; do
            run="$(gh api "repos/$GH_REPO/actions/runs/$run_id" \
              --jq '[.path, .conclusion, .head_repository.full_name] | @tsv')" || continue
            IFS=$'\t' read -r path conclusion head_repo <<<"$run"
            if [[ "$path" != ".github/workflows/ci.yml" || "$conclusion" != "success" || "$head_repo" != "$GH_REPO" ]]; then
              continue
            fi
            dir="$RUNNER_TEMP/prebuilt-$run_id"
            if gh run download "$run_id" --name "$name" --dir "$dir"; then
              echo "Using the build from CI run $run_id for tree $tree"
              echo "archive=$dir/next-build.tar" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::notice::No successful CI build for tree $tree is available; the VPS will build."

      - name: Configure pinned SSH trust
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          : "${VPS_SSH_KEY:?Missing VPS_SSH_KEY production secret}"
          : "${VPS_KNOWN_HOSTS:?Missing VPS_KNOWN_HOSTS production secret}"
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/webofficial_deploy"
          printf '%s\n' "$VPS_SSH_KEY" > "$HOME/.ssh/webofficial_deploy"
          install -m 600 /dev/null "$HOME/.ssh/known_hosts"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Run the canonical staged deploy
        env:
          VPS_HOSTNAME: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          # The step above proved CI succeeded for this commit, so the VPS
          # build can skip its duplicate TypeScript pass.
          CI_TYPECHECKED_SHA: ${{ env.DEPLOY_SHA }}
          PREBUILT_NEXT_ARCHIVE: ${{ steps.prebuilt.outputs.archive }}
        run: |
          set -euo pipefail
          : "${VPS_HOSTNAME:?Missing VPS_HOST production secret}"
          : "${VPS_USER:?Missing VPS_USER production secret}"
          release_id="${DEPLOY_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          VPS_HOST="${VPS_USER}@${VPS_HOSTNAME}" \
          VPS_PORT="${VPS_PORT:-22}" \
          DEPLOY_KEY="$HOME/.ssh/webofficial_deploy" \
          DEPLOY_RELEASE_ID="$release_id" \
            bash scripts/deploy-vps.sh
